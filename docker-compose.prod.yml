# Продакшен-стек: backend + frontend + nginx (TLS-терминация, роутинг по
# путям) + certbot (автопродление сертификатов). Один домен, без прямого
# проброса портов backend/frontend наружу — наружу торчит только nginx.
#
# Перед первым запуском:
#   cp .env.production.example .env      # и заполните значения
#   cp backend/.env.example backend/.env # и смените секреты
#   ./scripts/render-nginx-config.sh
#   ./init-letsencrypt.sh
#
# Запуск: docker compose -f docker-compose.prod.yml up -d --build
# Подробности — в DEPLOY.md.

services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/couple_questions.db}
    volumes:
      - backend_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      args:
        # Обязательно должен быть задан в .env как полный https-адрес с /api,
        # например https://example.com/api — это значение "запекается"
        # в JS-бандл на этапе сборки, поменять на лету нельзя.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Укажите NEXT_PUBLIC_API_URL в .env, например https://your-domain.example/api}
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    depends_on:
      - backend
      - frontend
    networks:
      - app-network

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    entrypoint: /bin/sh
    command: -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  certbot-www:
  certbot-conf:
  backend_data:
