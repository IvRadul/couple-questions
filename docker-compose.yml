services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      # По умолчанию SQLite лежит в volume backend_data — переопределите
      # DATABASE_URL в backend/.env, если хотите использовать PostgreSQL.
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/couple_questions.db}
    volumes:
      - backend_data:/app/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
